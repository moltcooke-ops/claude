<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <!-- Gritty texture overlay -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="roughEdge">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Halftone dot pattern -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#0D3B6E" opacity="0.12"/>
    </pattern>
    <!-- Diagonal lines texture -->
    <pattern id="diagonalLines" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1D9E75" stroke-width="1" opacity="0.08"/>
    </pattern>
    <!-- Road stripe pattern -->
    <pattern id="roadStripe" x="0" y="0" width="80" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="40" height="4" fill="#F0E84A" rx="1"/>
    </pattern>
  </defs>

  <!-- Background - deep navy -->
  <rect width="2048" height="2048" fill="#0D3B6E"/>

  <!-- Subtle background texture -->
  <rect width="2048" height="2048" fill="url(#halftone)"/>
  <rect width="2048" height="2048" fill="url(#diagonalLines)"/>

  <!-- City skyline silhouette (Vancouver-esque) -->
  <!-- Mountains -->
  <polygon points="0,750 300,480 550,650 700,420 950,600 1100,380 1300,550 1500,350 1700,500 2048,400 2048,750" fill="#092D54" opacity="0.7"/>
  <polygon points="0,780 200,580 450,700 650,500 850,680 1050,450 1250,620 1450,410 1650,560 1850,430 2048,520 2048,780" fill="#0A3360" opacity="0.6"/>

  <!-- Buildings silhouette -->
  <rect x="150" y="680" width="60" height="120" fill="#092D54" opacity="0.5"/>
  <rect x="230" y="640" width="80" height="160" fill="#092D54" opacity="0.5"/>
  <rect x="330" y="700" width="50" height="100" fill="#092D54" opacity="0.5"/>
  <rect x="500" y="620" width="70" height="180" fill="#092D54" opacity="0.5"/>
  <rect x="590" y="660" width="55" height="140" fill="#092D54" opacity="0.5"/>
  <rect x="1300" y="650" width="65" height="150" fill="#092D54" opacity="0.5"/>
  <rect x="1400" y="600" width="90" height="200" fill="#092D54" opacity="0.5"/>
  <rect x="1510" y="670" width="50" height="130" fill="#092D54" opacity="0.5"/>
  <rect x="1600" y="630" width="75" height="170" fill="#092D54" opacity="0.5"/>
  <rect x="1700" y="680" width="60" height="120" fill="#092D54" opacity="0.5"/>

  <!-- === THE BUS === -->
  <g transform="translate(180, 820)" filter="url(#roughEdge)">

    <!-- Bus body shadow -->
    <rect x="8" y="8" width="1680" height="520" rx="30" fill="#061E38" opacity="0.4"/>

    <!-- Bus body main -->
    <rect x="0" y="0" width="1680" height="520" rx="30" fill="#1D9E75"/>

    <!-- Bus body top accent stripe -->
    <rect x="0" y="0" width="1680" height="80" rx="30" fill="#17886A"/>
    <rect x="0" y="50" width="1680" height="30" fill="#17886A"/>

    <!-- White stripe accent along middle -->
    <rect x="20" y="310" width="1640" height="12" fill="white" opacity="0.9" rx="6"/>

    <!-- Secondary thin stripe -->
    <rect x="20" y="335" width="1640" height="4" fill="white" opacity="0.4" rx="2"/>

    <!-- Windows -->
    <!-- Front windshield -->
    <rect x="1440" y="60" width="200" height="230" rx="20" fill="#0D3B6E" stroke="white" stroke-width="5"/>
    <rect x="1460" y="80" width="160" height="190" rx="12" fill="#1A5A9E" opacity="0.7"/>
    <!-- Windshield glare -->
    <rect x="1470" y="85" width="40" height="170" rx="8" fill="white" opacity="0.15"/>

    <!-- Passenger windows -->
    <rect x="120" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="320" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="520" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="720" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="920" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="1120" y="80" width="160" height="180" rx="15" fill="#0D3B6E" stroke="white" stroke-width="4"/>

    <!-- Window glare accents -->
    <rect x="130" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>
    <rect x="330" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>
    <rect x="530" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>
    <rect x="730" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>
    <rect x="930" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>
    <rect x="1130" y="90" width="25" height="150" rx="8" fill="white" opacity="0.12"/>

    <!-- Door -->
    <rect x="1300" y="160" width="100" height="310" rx="8" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <line x1="1350" y1="170" x2="1350" y2="460" stroke="white" stroke-width="3" opacity="0.5"/>
    <!-- Door handle -->
    <rect x="1360" y="300" width="25" height="8" rx="4" fill="#F0E84A"/>

    <!-- Headlight -->
    <ellipse cx="1660" cy="380" rx="30" ry="35" fill="#F0E84A"/>
    <ellipse cx="1660" cy="380" rx="18" ry="22" fill="white" opacity="0.7"/>

    <!-- Tail light -->
    <rect x="10" y="360" width="20" height="50" rx="8" fill="#E8443A"/>

    <!-- Bumper -->
    <rect x="30" y="480" width="1620" height="30" rx="10" fill="#0D3B6E"/>
    <rect x="50" y="485" width="1580" height="6" rx="3" fill="white" opacity="0.15"/>

    <!-- Bus number/route display -->
    <rect x="1450" y="15" width="180" height="35" rx="5" fill="#0D3B6E"/>
    <text x="1540" y="40" font-family="'Arial Black', 'Impact', sans-serif" font-size="22" fill="#F0E84A" text-anchor="middle" font-weight="900" letter-spacing="2">ROUTE YVR</text>

    <!-- Side decal - stars/indie marks -->
    <text x="80" y="420" font-family="'Arial Black', sans-serif" font-size="40" fill="white" opacity="0.25" font-weight="900">★ ★ ★</text>

    <!-- Wheel wells -->
    <rect x="250" y="490" width="200" height="50" rx="25" fill="#0D3B6E"/>
    <rect x="1200" y="490" width="200" height="50" rx="25" fill="#0D3B6E"/>
  </g>

  <!-- Wheels -->
  <g transform="translate(180, 820)">
    <!-- Rear wheel -->
    <circle cx="350" cy="530" r="80" fill="#111111"/>
    <circle cx="350" cy="530" r="65" fill="#222222"/>
    <circle cx="350" cy="530" r="55" fill="#333333" stroke="#444" stroke-width="3"/>
    <!-- Hubcap -->
    <circle cx="350" cy="530" r="30" fill="#555"/>
    <circle cx="350" cy="530" r="20" fill="#1D9E75"/>
    <circle cx="350" cy="530" r="8" fill="#0D3B6E"/>
    <!-- Spokes -->
    <line x1="350" y1="480" x2="350" y2="580" stroke="#444" stroke-width="3"/>
    <line x1="300" y1="530" x2="400" y2="530" stroke="#444" stroke-width="3"/>
    <line x1="315" y1="495" x2="385" y2="565" stroke="#444" stroke-width="3"/>
    <line x1="385" y1="495" x2="315" y2="565" stroke="#444" stroke-width="3"/>

    <!-- Front wheel -->
    <circle cx="1300" cy="530" r="80" fill="#111111"/>
    <circle cx="1300" cy="530" r="65" fill="#222222"/>
    <circle cx="1300" cy="530" r="55" fill="#333333" stroke="#444" stroke-width="3"/>
    <!-- Hubcap -->
    <circle cx="1300" cy="530" r="30" fill="#555"/>
    <circle cx="1300" cy="530" r="20" fill="#1D9E75"/>
    <circle cx="1300" cy="530" r="8" fill="#0D3B6E"/>
    <!-- Spokes -->
    <line x1="1300" y1="480" x2="1300" y2="580" stroke="#444" stroke-width="3"/>
    <line x1="1250" y1="530" x2="1350" y2="530" stroke="#444" stroke-width="3"/>
    <line x1="1265" y1="495" x2="1335" y2="565" stroke="#444" stroke-width="3"/>
    <line x1="1335" y1="495" x2="1265" y2="565" stroke="#444" stroke-width="3"/>
  </g>

  <!-- Road -->
  <rect x="0" y="1430" width="2048" height="180" fill="#1A1A1A"/>
  <rect x="0" y="1500" width="2048" height="10" fill="url(#roadStripe)"/>
  <!-- Road grit -->
  <circle cx="200" cy="1470" r="2" fill="#333" opacity="0.5"/>
  <circle cx="600" cy="1490" r="3" fill="#333" opacity="0.4"/>
  <circle cx="1000" cy="1460" r="2" fill="#333" opacity="0.5"/>
  <circle cx="1400" cy="1480" r="2.5" fill="#333" opacity="0.4"/>
  <circle cx="1800" cy="1470" r="2" fill="#333" opacity="0.5"/>

  <!-- Exhaust fumes from rear -->
  <g opacity="0.3">
    <ellipse cx="150" cy="1320" rx="40" ry="20" fill="white" opacity="0.15"/>
    <ellipse cx="100" cy="1300" rx="55" ry="25" fill="white" opacity="0.1"/>
    <ellipse cx="60" cy="1270" rx="70" ry="30" fill="white" opacity="0.07"/>
    <ellipse cx="30" cy="1230" rx="50" ry="22" fill="white" opacity="0.04"/>
  </g>

  <!-- Speed lines -->
  <g stroke="white" stroke-width="3" opacity="0.15">
    <line x1="0" y1="950" x2="120" y2="950"/>
    <line x1="20" y1="1020" x2="100" y2="1020"/>
    <line x1="0" y1="1100" x2="140" y2="1100"/>
    <line x1="30" y1="1180" x2="90" y2="1180"/>
    <line x1="0" y1="1250" x2="110" y2="1250"/>
  </g>

  <!-- ======= MAIN TITLE ======= -->
  <!-- Text shadow/outline for depth -->
  <text x="1024" y="1730" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="200" fill="#061E38" text-anchor="middle" font-weight="900" letter-spacing="12" font-stretch="condensed">THE VAN BUS</text>
  <!-- Main text -->
  <text x="1024" y="1726" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="200" fill="white" text-anchor="middle" font-weight="900" letter-spacing="12" font-stretch="condensed">THE VAN BUS</text>
  <!-- Teal accent underline -->
  <rect x="280" y="1755" width="1488" height="10" rx="5" fill="#1D9E75"/>

  <!-- Decorative dashes flanking title -->
  <rect x="200" y="1645" width="60" height="8" rx="4" fill="#1D9E75" opacity="0.6"/>
  <rect x="1788" y="1645" width="60" height="8" rx="4" fill="#1D9E75" opacity="0.6"/>

  <!-- Subtitle / URL -->
  <text x="1024" y="1830" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="52" fill="white" text-anchor="middle" font-weight="400" letter-spacing="8" opacity="0.6">thevanbus.com</text>

  <!-- Tagline accent -->
  <text x="1024" y="1920" font-family="'Arial Black', 'Impact', sans-serif" font-size="36" fill="#1D9E75" text-anchor="middle" font-weight="700" letter-spacing="14" opacity="0.5">VANCOUVER • INDIE • CREATORS</text>

  <!-- Sticker-style border ring (subtle) -->
  <rect x="30" y="30" width="1988" height="1988" rx="60" fill="none" stroke="white" stroke-width="4" opacity="0.08"/>
  <rect x="50" y="50" width="1948" height="1948" rx="50" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.12"/>

  <!-- Grain overlay for screen-print feel -->
  <rect width="2048" height="2048" fill="url(#halftone)" opacity="0.3"/>
</svg>