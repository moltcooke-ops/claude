<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Gritty texture overlay -->
    <filter id="grain16">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
    <filter id="roughEdge16">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Halftone dot pattern -->
    <pattern id="halftone16" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2" fill="#0D3B6E" opacity="0.1"/>
    </pattern>
    <!-- Diagonal lines -->
    <pattern id="diag16" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1D9E75" stroke-width="0.8" opacity="0.06"/>
    </pattern>
    <!-- Road stripe pattern -->
    <pattern id="roadStripe16" x="0" y="0" width="100" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="50" height="4" fill="#F0E84A" rx="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="#0D3B6E"/>
  <rect width="3840" height="2160" fill="url(#halftone16)"/>
  <rect width="3840" height="2160" fill="url(#diag16)"/>

  <!-- Mountains - wider panorama -->
  <polygon points="0,820 200,600 450,720 700,480 950,650 1200,420 1500,580 1800,380 2100,520 2400,350 2700,490 3000,400 3300,530 3600,450 3840,500 3840,850" fill="#092D54" opacity="0.65"/>
  <polygon points="0,870 300,680 600,780 900,560 1200,700 1500,500 1800,660 2100,440 2400,600 2700,450 3000,580 3300,480 3600,560 3840,520 3840,880" fill="#0A3360" opacity="0.5"/>

  <!-- Building silhouettes - panoramic -->
  <rect x="200" y="760" width="70" height="130" fill="#092D54" opacity="0.45"/>
  <rect x="290" y="720" width="90" height="170" fill="#092D54" opacity="0.45"/>
  <rect x="400" y="780" width="55" height="110" fill="#092D54" opacity="0.45"/>
  <rect x="600" y="700" width="80" height="190" fill="#092D54" opacity="0.45"/>
  <rect x="700" y="740" width="60" height="150" fill="#092D54" opacity="0.45"/>
  <rect x="2900" y="720" width="75" height="170" fill="#092D54" opacity="0.45"/>
  <rect x="3000" y="680" width="100" height="210" fill="#092D54" opacity="0.45"/>
  <rect x="3120" y="750" width="55" height="140" fill="#092D54" opacity="0.45"/>
  <rect x="3250" y="710" width="80" height="180" fill="#092D54" opacity="0.45"/>
  <rect x="3400" y="760" width="65" height="130" fill="#092D54" opacity="0.45"/>

  <!-- ======= THE BUS — centered, larger for banner ======= -->
  <g transform="translate(600, 850)" filter="url(#roughEdge16)">

    <!-- Bus body shadow -->
    <rect x="10" y="10" width="2640" height="580" rx="35" fill="#061E38" opacity="0.35"/>

    <!-- Bus body -->
    <rect x="0" y="0" width="2640" height="580" rx="35" fill="#1D9E75"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="2640" height="85" rx="35" fill="#17886A"/>
    <rect x="0" y="55" width="2640" height="30" fill="#17886A"/>

    <!-- White stripes -->
    <rect x="25" y="350" width="2590" height="14" fill="white" opacity="0.9" rx="7"/>
    <rect x="25" y="378" width="2590" height="5" fill="white" opacity="0.35" rx="2"/>

    <!-- Front windshield -->
    <rect x="2340" y="65" width="250" height="265" rx="22" fill="#0D3B6E" stroke="white" stroke-width="5"/>
    <rect x="2365" y="90" width="200" height="215" rx="14" fill="#1A5A9E" opacity="0.7"/>
    <rect x="2375" y="95" width="45" height="200" rx="10" fill="white" opacity="0.15"/>

    <!-- Passenger windows -->
    <rect x="100" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="340" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="580" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="820" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="1060" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="1300" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="1540" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <rect x="1780" y="85" width="200" height="210" rx="18" fill="#0D3B6E" stroke="white" stroke-width="4"/>

    <!-- Window glare -->
    <rect x="112" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="352" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="592" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="832" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="1072" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="1312" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="1552" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>
    <rect x="1792" y="98" width="28" height="175" rx="8" fill="white" opacity="0.1"/>

    <!-- Door -->
    <rect x="2100" y="180" width="120" height="350" rx="10" fill="#0D3B6E" stroke="white" stroke-width="4"/>
    <line x1="2160" y1="190" x2="2160" y2="520" stroke="white" stroke-width="3" opacity="0.5"/>
    <rect x="2172" y="340" width="30" height="8" rx="4" fill="#F0E84A"/>

    <!-- Headlight -->
    <ellipse cx="2610" cy="430" rx="35" ry="40" fill="#F0E84A"/>
    <ellipse cx="2610" cy="430" rx="20" ry="25" fill="white" opacity="0.7"/>

    <!-- Tail light -->
    <rect x="12" y="400" width="22" height="55" rx="8" fill="#E8443A"/>

    <!-- Bumper -->
    <rect x="40" y="540" width="2560" height="32" rx="12" fill="#0D3B6E"/>
    <rect x="60" y="546" width="2520" height="6" rx="3" fill="white" opacity="0.12"/>

    <!-- Route display -->
    <rect x="2350" y="18" width="220" height="38" rx="6" fill="#0D3B6E"/>
    <text x="2460" y="45" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" fill="#F0E84A" text-anchor="middle" font-weight="900" letter-spacing="2">ROUTE YVR</text>

    <!-- Stars decal -->
    <text x="70" y="470" font-family="'Arial Black', sans-serif" font-size="42" fill="white" opacity="0.2" font-weight="900">★ ★ ★ ★ ★</text>

    <!-- Wheel wells -->
    <rect x="350" y="550" width="240" height="55" rx="28" fill="#0D3B6E"/>
    <rect x="2000" y="550" width="240" height="55" rx="28" fill="#0D3B6E"/>
  </g>

  <!-- Wheels -->
  <g transform="translate(600, 850)">
    <!-- Rear wheel -->
    <circle cx="470" cy="595" r="90" fill="#111111"/>
    <circle cx="470" cy="595" r="73" fill="#222222"/>
    <circle cx="470" cy="595" r="62" fill="#333333" stroke="#444" stroke-width="3"/>
    <circle cx="470" cy="595" r="34" fill="#555"/>
    <circle cx="470" cy="595" r="22" fill="#1D9E75"/>
    <circle cx="470" cy="595" r="9" fill="#0D3B6E"/>
    <line x1="470" y1="540" x2="470" y2="650" stroke="#444" stroke-width="3"/>
    <line x1="415" y1="595" x2="525" y2="595" stroke="#444" stroke-width="3"/>
    <line x1="431" y1="556" x2="509" y2="634" stroke="#444" stroke-width="3"/>
    <line x1="509" y1="556" x2="431" y2="634" stroke="#444" stroke-width="3"/>

    <!-- Front wheel -->
    <circle cx="2120" cy="595" r="90" fill="#111111"/>
    <circle cx="2120" cy="595" r="73" fill="#222222"/>
    <circle cx="2120" cy="595" r="62" fill="#333333" stroke="#444" stroke-width="3"/>
    <circle cx="2120" cy="595" r="34" fill="#555"/>
    <circle cx="2120" cy="595" r="22" fill="#1D9E75"/>
    <circle cx="2120" cy="595" r="9" fill="#0D3B6E"/>
    <line x1="2120" y1="540" x2="2120" y2="650" stroke="#444" stroke-width="3"/>
    <line x1="2065" y1="595" x2="2175" y2="595" stroke="#444" stroke-width="3"/>
    <line x1="2081" y1="556" x2="2159" y2="634" stroke="#444" stroke-width="3"/>
    <line x1="2159" y1="556" x2="2081" y2="634" stroke="#444" stroke-width="3"/>
  </g>

  <!-- Road -->
  <rect x="0" y="1540" width="3840" height="200" fill="#1A1A1A"/>
  <rect x="0" y="1620" width="3840" height="10" fill="url(#roadStripe16)"/>

  <!-- Road grit -->
  <circle cx="300" cy="1580" r="2.5" fill="#333" opacity="0.4"/>
  <circle cx="900" cy="1600" r="3" fill="#333" opacity="0.35"/>
  <circle cx="1500" cy="1570" r="2" fill="#333" opacity="0.45"/>
  <circle cx="2100" cy="1590" r="2.5" fill="#333" opacity="0.4"/>
  <circle cx="2700" cy="1575" r="3" fill="#333" opacity="0.35"/>
  <circle cx="3300" cy="1600" r="2" fill="#333" opacity="0.45"/>

  <!-- Exhaust fumes -->
  <g opacity="0.25">
    <ellipse cx="500" cy="1400" rx="45" ry="22" fill="white" opacity="0.15"/>
    <ellipse cx="440" cy="1375" rx="60" ry="28" fill="white" opacity="0.1"/>
    <ellipse cx="380" cy="1340" rx="80" ry="35" fill="white" opacity="0.06"/>
    <ellipse cx="330" cy="1300" rx="55" ry="25" fill="white" opacity="0.03"/>
  </g>

  <!-- Speed lines -->
  <g stroke="white" stroke-width="3" opacity="0.12">
    <line x1="50" y1="1000" x2="220" y2="1000"/>
    <line x1="80" y1="1080" x2="180" y2="1080"/>
    <line x1="30" y1="1170" x2="250" y2="1170"/>
    <line x1="100" y1="1260" x2="160" y2="1260"/>
    <line x1="40" y1="1350" x2="200" y2="1350"/>
    <line x1="70" y1="1430" x2="150" y2="1430"/>
  </g>

  <!-- ======= MAIN TITLE — big and bold ======= -->
  <!-- Shadow -->
  <text x="1920" y="1890" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="260" fill="#061E38" text-anchor="middle" font-weight="900" letter-spacing="18" font-stretch="condensed">THE VAN BUS</text>
  <!-- Main -->
  <text x="1920" y="1886" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="260" fill="white" text-anchor="middle" font-weight="900" letter-spacing="18" font-stretch="condensed">THE VAN BUS</text>

  <!-- Teal underline -->
  <rect x="500" y="1920" width="2840" height="12" rx="6" fill="#1D9E75"/>

  <!-- Flanking dashes -->
  <rect x="380" y="1790" width="80" height="10" rx="5" fill="#1D9E75" opacity="0.5"/>
  <rect x="3380" y="1790" width="80" height="10" rx="5" fill="#1D9E75" opacity="0.5"/>

  <!-- URL -->
  <text x="1920" y="2010" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="58" fill="white" text-anchor="middle" font-weight="400" letter-spacing="10" opacity="0.55">thevanbus.com</text>

  <!-- Tagline -->
  <text x="1920" y="2090" font-family="'Arial Black', 'Impact', sans-serif" font-size="38" fill="#1D9E75" text-anchor="middle" font-weight="700" letter-spacing="16" opacity="0.45">VANCOUVER • INDIE • CREATORS</text>

  <!-- Subtle border -->
  <rect x="30" y="30" width="3780" height="2100" rx="40" fill="none" stroke="white" stroke-width="3" opacity="0.06"/>
  <rect x="50" y="50" width="3740" height="2060" rx="30" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.1"/>

  <!-- Grain overlay -->
  <rect width="3840" height="2160" fill="url(#halftone16)" opacity="0.25"/>
</svg>